---
# playbooks/helm-tooling.yml
# Usage (validate on devops-test first, then roll to devops-prod):
#   ansible-playbook playbooks/helm-tooling.yml --limit devops-test --check --diff
#   ansible-playbook playbooks/helm-tooling.yml --limit devops-test
#   ansible-playbook playbooks/helm-tooling.yml --limit devops-prod
#
# Become passwords come per host from inventory/host_vars/<host>/become.sops.yaml (SOPS) - no -K needed.
#
# Do NOT add `become: true` at play level: the helm-diff plugin must install
# for the connecting user (ace / ubuntu), not root. The role escalates only
# where it needs to. Versions live in inventory/group_vars/devops/helm.yml.
- name: Helm CLI and helm-diff plugin
  hosts: devops
  gather_facts: true
  roles:
    - helm_tooling
