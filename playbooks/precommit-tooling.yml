---
# Usage (validate on devops-test first, then roll to devops-prod):
#   ansible-playbook playbooks/precommit-tooling.yml --limit devops-test --check --diff
#   ansible-playbook playbooks/precommit-tooling.yml --limit devops-test
#   ansible-playbook playbooks/precommit-tooling.yml --limit devops-prod
#
# Become passwords come per host from inventory/host_vars/<host>/become.sops.yaml (SOPS) - no -K needed.
#
# Do NOT add `become: true` at play level: pre-commit must install for the
# connecting user (ace / ubuntu), not root. The role escalates only for apt.
#
# Repos to hook are set per group in inventory/group_vars (precommit_repos).
- name: Developer tooling - git, GitHub CLI, pre-commit secret scanning
  hosts: devops
  gather_facts: true
  roles:
    - precommit_tooling
